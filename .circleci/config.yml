version: 2.1

jobs:
  build-and-test:

    docker:
      - image: cimg/python:3.8

    steps:
      - checkout
      - run: pip install --upgrade pip && pip install -r requirements/local.txt
      - run:
          name: Tests
          command: tox

      - store_artifacts:
          path: htmlcov

workflows:
  version: 2
  workflow:
    jobs:
    - build-and-test
